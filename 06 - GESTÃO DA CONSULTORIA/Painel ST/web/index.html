<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0E">
<title>Painel ST</title>
<link rel="icon" type="image/png" sizes="512x512" href="/icone.png">
<link rel="stylesheet" href="/painel.css">
</head>
<body>
<div class="sala" aria-hidden="true"><i class="luz a"></i><i class="luz b"></i><i class="luz c"></i><i class="luz d"></i><i class="grao"></i></div>

<div class="app" id="app">
  <nav class="trilho vidro" aria-label="Menu">
    <div class="logo" title="Souto Treinador"><span>ST</span></div>
    <div class="nav" id="nav"></div>
  </nav>

  <div class="conteudo">
    <header class="topo">
      <p class="ola" id="ola">Olá</p>
      <span class="selo-demo" id="selo-demo" hidden>DEMONSTRAÇÃO · dados fictícios</span>
      <label class="busca vidro" for="busca">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="busca" type="search" placeholder="Buscar aluno" autocomplete="off">
      </label>
      <button class="redondo vidro" id="atualizar" aria-label="Atualizar os dados" title="Atualizar os dados">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.4L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.4L20 16"/><path d="M20 20v-4h-4"/></svg>
      </button>
      <a class="redondo vidro" id="sino" href="#hoje" aria-label="Hoje">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
      </a>
    </header>
    <main id="tela" class="tela" aria-live="polite"></main>
  </div>

  <aside class="gente" id="gente" aria-label="Alunos e leads"></aside>
</div>

<nav class="doca vidro" id="doca" aria-label="Menu"></nav>
<div class="aviso vidro" id="aviso" role="status"></div>
<script src="/painel.js"></script>
</body>
</html>
